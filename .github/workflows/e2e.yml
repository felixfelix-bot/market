          if-no-files-found: ignore

      - name: Upload full test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results-full
          path: test-results/
          retention-days: 7

      - name: Notify Buzz (#ci)
        if: ${{ !cancelled() }}
        continue-on-error: true
