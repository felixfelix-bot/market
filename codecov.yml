# codecov.yml — Codecov configuration for Plebeian Market
#
# Diff-aware coverage gate. Replaces scripts/check-coverage.ts as the source of
# truth for "modified code must be covered" on PRs (see
# docs/plans/pr-trust-pipeline.md, Layer 1 Phase 1B). The DIY script stays as a
# local pre-push soft gate; once the Codecov patch status is a required
# branch-protection check, .github/workflows/coverage-gate.yml can be retired.
#
# File scope (per FILE INCLUSION RULES): src/**/*.{ts,tsx,js} only.
#   Excluded: e2e/**, *.test.ts, *.spec.ts, *.d.ts, src/generated/**
#   Non-src product trees (contextvm/) are ignored here per the src-only rule.
#   NOTE: this means contextvm changes are NOT gated by Codecov. If contextvm
#   coverage should also be enforced, remove "contextvm/**" from ignore below.

comment:
  # PR comment shows per-file diff coverage, the file list, and the tree.
  layout: 'diff, files, tree'
  require_changes: false # comment on every PR so diff coverage is always surfaced

coverage:
  range: '70...100'
  precision: 2
  round: down

  status:
    # Whole-project informational floor — surface only, never blocks a PR.
    project:
      default:
        target: auto # measured against the parent commit
        threshold: 0%
        informational: true

    # Diff-aware gate. Only NEW or MODIFIED lines count.
    # target 100% = every changed line must be exercised. This is the
    # "modified-file ratchet": touching code can only raise coverage, never
    # lower it, because each changed line must be covered.
    patch:
      default:
        target: 100%
        threshold: 0%
        informational: false

  ignore:
    # Noise / non-product code:
    - 'e2e/**'
    - '**/*.test.ts'
    - '**/*.spec.ts'
    - '**/*.d.ts'
    - 'src/generated/**'
    # Non-src product trees (per src-only FILE INCLUSION RULES):
    - 'contextvm/**'
